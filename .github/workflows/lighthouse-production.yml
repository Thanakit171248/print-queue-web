name: PrintDekD Lighthouse audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Lighthouse CI against production
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.json

      - name: Save Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: printdekd-lighthouse-reports
          path: lhci-reports/
          if-no-files-found: ignore
          retention-days: 14
